name: Bug report
description: Something goes wrong in a co-op game, with the installer or at the start-up
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. The more of this you fill in (and the logs you attach), the faster it can be fixed.
        Please do not post the game's files, a cracked exe or a link to one.
  - type: input
    id: version
    attributes:
      label: Mod version
      description: The installer's title bar, or `coop\version.txt` in the game folder. Every player of the session should have the same version.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Game edition
      options:
        - Retail / digital copy with patch 1.2 (main menu says Ver 1.02)
        - Steam, brought to 1.2 with the community update package
        - GOG
        - Community pre-patched exe
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: What were you doing
      options:
        - Hosting a co-op game
        - Joining a co-op game
        - Split screen on one PC
        - Split screen in a network game
        - Installing / updating / uninstalling
        - Starting the game
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
      description: Chapter / level, what you did just before, what the screen showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: 'Steps, or "only once". For a network problem say LAN, Internet or a VPN (which one), and whether the same happens when you join by IP address.'
  - type: textarea
    id: pc
    attributes:
      label: PC
      description: Windows version, graphics card, how many CPU threads. The zip below has this too.
  - type: markdown
    attributes:
      value: |
        **Logs: please attach the zip made by `<game folder>\coop\Collect logs.bat`** (drag it into the comment box). It holds the
        mod's logs (`bin\ts_coop.log` and `ts_coop.1.log` to `ts_coop.4.log`), the install record, hashes and system information; it removes your
        Windows user name, computer name, player name and public IP addresses. Open it to check before you attach it.
        For a network problem a zip from the host AND from a client of the same session helps most.
  - type: checkboxes
    id: checks
    attributes:
      label: Checked
      options:
        - label: All players of the session have the same mod version.
        - label: The game was started with the "TimeShift Co-op" shortcut (or I say below how it was started).
